[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing your own Instagram saved posts, home feed, profiles, posts and reels to Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Juan Rodríguez Díaz de Greñu" },
]
keywords = ["instagram", "mcp", "claude", "playwright", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "playwright>=1.48",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/YoppaV/instagram-mcp"
Issues = "https://github.com/YoppaV/instagram-mcp/issues"

[project.scripts]
instagram-mcp = "instagram_sdk.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["instagram_sdk*"]
