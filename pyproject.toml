[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-sdk"
version = "0.1.0"
description = "Read-only MCP server exposing Instagram saved posts, home feed, profiles, and posts to Claude."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "playwright>=1.48",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
instagram-sdk = "instagram_sdk.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["instagram_sdk*"]
