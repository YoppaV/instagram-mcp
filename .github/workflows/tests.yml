name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installs the playwright Python package only. We do NOT run
      # ``python -m playwright install chromium`` — the fixture-driven
      # tests never launch a real browser, and the lone live test in
      # tests/test_endpoints_live.py self-skips without RUN_LIVE_TESTS=1.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install package (editable)
        run: pip install -e .

      - name: Run unittest suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover tests -v
